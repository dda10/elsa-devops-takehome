apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quote-api
  namespace: quote-api
  labels:
    app.kubernetes.io/name: quote-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: quote-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
