apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quote-api.name" . }}
  labels:
    {{- include "quote-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quote-api.name" . }}
                port:
                  name: http
