# Karpenter v1 (karpenter.k8s.aws/v1). Discovery tags are cluster-specific:
# render with CLUSTER_NAME=<cluster> envsubst before applying.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-inference
spec:
  role: "KarpenterNodeRole-${CLUSTER_NAME}"
  amiSelectorTerms:
    # AL2023 alias resolves to the NVIDIA-enabled AMI for GPU instance types.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  blockDeviceMappings:
    # Model weights are large; a bigger root volume avoids disk-pressure evictions.
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
