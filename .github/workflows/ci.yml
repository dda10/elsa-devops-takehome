# Part 4: GitHub Actions replacement for ci/legacy.gitlab-ci.yml.
# Gates: unit tests and a hard-failing SAST scan must pass before an image is built.
# The image is pushed to GHCR only on pushes to main, tagged with the full git SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: app
      # No `|| echo`: a failing test fails the job.
      - name: Unit tests
        run: pytest -q
        working-directory: app

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep==1.181.0
      # --error makes any finding a non-zero exit, so the job fails.
      # --metrics=off keeps the scan from phoning home.
      - name: Semgrep (hard gate)
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off app

  image:
    needs: [test, sast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR requires a lowercase image path; GITHUB_REPOSITORY can contain capitals.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Multi-arch: reviewers on Apple Silicon run arm64 k3s nodes.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Only immutable full-SHA tags; no floating "latest". scripts/20-deploy.sh deploys exactly this tag.
          tags: type=sha,format=long,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
